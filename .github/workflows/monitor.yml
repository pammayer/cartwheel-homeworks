name: monitor

on:
  schedule:
    # Daily. Time of day is arbitrary; adjust if a different window is better.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  monitor:
    name: monitor last 24 hours
    # Langfuse lives at localhost:3000 on the developer's machine, unreachable
    # from a GitHub-hosted runner — this needs a self-hosted runner registered
    # to this repo and running on that machine.
    runs-on: self-hosted
    # The self-hosted runner's service account (NT AUTHORITY\NETWORK SERVICE)
    # hits Windows' default PowerShell execution policy (Restricted), which
    # blocks every `run:` step. Using bash (Git for Windows, already present)
    # sidesteps it without touching a system-wide security setting. Must be
    # the explicit path, not the `bash` alias — under this service account's
    # PATH, plain `bash` resolves to Windows' own WSL stub
    # (C:\Windows\System32\bash.exe) ahead of Git's, and WSL has no
    # distribution installed.
    defaults:
      run:
        shell: 'C:\Program Files\Git\bin\bash.exe -e {0}'
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONIOENCODING: utf-8
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST }}
      # The frozen judge's provider key (anthropic/claude-haiku-4-5-20251001),
      # not the Cartwheel agent's — this job only reads existing traces, it
      # never runs the agent.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      # astral-sh/setup-uv@v5's Node wrapper hits a known upstream libuv bug
      # (nodejs/node#56645) on exit under this runner's Windows service
      # account — uv itself installs fine, then the Node process crashes.
      # The shell installer sidesteps Node entirely.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync

      - name: Run the monitor over the last 24 hours
        run: uv run python -m monitoring.run --last-hours 24

      - name: Upload monitoring output as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-output
          path: |
            monitoring/history.jsonl
            monitoring/prevalence.svg
          if-no-files-found: warn

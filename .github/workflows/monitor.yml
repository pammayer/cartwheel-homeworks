name: monitor

on:
  schedule:
    # Daily. Time of day is arbitrary; adjust if a different window is better.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  monitor:
    name: monitor last 24 hours
    # Langfuse lives at localhost:3000 on the developer's machine, unreachable
    # from a GitHub-hosted runner — this needs a self-hosted runner registered
    # to this repo and running on that machine.
    runs-on: self-hosted
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONIOENCODING: utf-8
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST }}
      # The frozen judge's provider key (anthropic/claude-haiku-4-5-20251001),
      # not the Cartwheel agent's — this job only reads existing traces, it
      # never runs the agent.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      # astral-sh/setup-uv@v5's Node wrapper hits a known upstream libuv bug
      # (nodejs/node#56645) on exit under this runner's service account —
      # uv itself installs fine, then the Node process crashes. uv's own
      # PowerShell installer avoids Node entirely.
      - name: Install uv
        # uv's default Windows install directory is inconsistent across
        # versions/environments (astral-sh/uv#10014) — force a known path
        # with UV_INSTALL_DIR instead of guessing where it landed.
        run: |
          $env:UV_INSTALL_DIR = "C:\uv-bin"
          irm https://astral.sh/uv/install.ps1 | iex
          # Windows PowerShell 5.1's -Encoding utf8 still writes a BOM (true
          # BOM-less UTF-8 needs utf8NoBOM, added in PS7+), which GITHUB_PATH
          # doesn't parse correctly. .NET's UTF8Encoding($false) guarantees none.
          [System.IO.File]::AppendAllText($env:GITHUB_PATH, "C:\uv-bin`n", [System.Text.UTF8Encoding]::new($false))
      - run: uv sync

      - name: Run the monitor over the last 24 hours
        run: uv run python -m monitoring.run --last-hours 24

      - name: Upload monitoring output as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-output
          path: |
            monitoring/history.jsonl
            monitoring/prevalence.svg
          if-no-files-found: warn

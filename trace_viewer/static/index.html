<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Cartwheel Trace Viewer</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-header">
        <h1>Cartwheel Traces</h1>
        <button id="refresh-btn" title="Reload trace list">&#8635;</button>
      </div>
      <div id="trace-list">Loading traces&hellip;</div>
    </aside>
    <main id="detail">
      <div id="empty-state">Select a trace on the left to read it top to bottom.</div>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
